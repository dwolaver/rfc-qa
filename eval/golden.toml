[[question]]
id       = "tls12-first-message"
kind     = "version-specific"
question = "In TLS 1.2, what does the client send in its first handshake message?"
expected = [
    { rfc = 5246, section = "7.4.1.2", replaced_by = 9846, quote = "the ClientHello as its first message." },
    { rfc = 5246, section = "7.3", replaced_by = 9846, quote = "summarized as follows: The client sends a ClientHello message to" },
]

[[question]]
id       = "http2-rfc7540-priority"
kind     = "version-specific"
question = "In the original HTTP/2 specification, RFC 7540, how could a client say which streams depend on others?"
expected = [
    { rfc = 7540, section = "5.3", replaced_by = 9113, quote = "A client can assign a priority for a new stream by including" },
    { rfc = 7540, section = "5.3.1", replaced_by = 9113, quote = "Each stream can be given an explicit dependency on another stream." },
    { rfc = 7540, section = "6.3", replaced_by = 9113, quote = "The PRIORITY frame (type=0x2) specifies the sender-advised priority" },
]

