    { rfc = 9113, section = "5.2.1", quote = "HTTP/2 stream flow control aims to allow a variety of flow-control" },
    { rfc = 9113, section = "6.9", quote = "The WINDOW_UPDATE frame (type=0x08) is used to implement flow" },
    { rfc = 9113, section = "6.9.1", quote = "Flow control in HTTP/2 is implemented using a window kept by each" },
