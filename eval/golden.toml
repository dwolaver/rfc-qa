obsolete = [
    { rfc = 7540, section = "5.2", replaced_by = 9113 },
    { rfc = 7540, section = "5.2.1", replaced_by = 9113 },
    { rfc = 7540, section = "6.9", replaced_by = 9113 },
    { rfc = 7540, section = "6.9.1", replaced_by = 9113 },
