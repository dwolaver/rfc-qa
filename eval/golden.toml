[[question]]
id       = "tls13-resumption"
kind     = "stale-trap"
question = "How does a TLS 1.3 client resume an earlier session?"
expected = [
    { rfc = 9846, section = "2.2", quote = "established in a previous connection and then used to establish a new" },
    { rfc = 9846, section = "4.7.1", quote = "NewSessionTicket message creates a unique association between the" },
    { rfc = 9846, section = "4.3.11", quote = "The \"pre_shared_key\" extension is used to negotiate the identity of" },
]
obsolete = [
    { rfc = 8446, section = "2.2", replaced_by = 9846 },
    { rfc = 8446, section = "4.6.1", replaced_by = 9846 },
    { rfc = 8446, section = "4.2.11", replaced_by = 9846 },
    { rfc = 5077, section = "3", replaced_by = 9846 },
    { rfc = 5077, section = "3.1", replaced_by = 9846 },
]

