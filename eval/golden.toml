# ==================================================================================================
#  Golden question set: questions with the RFC sections that answer them
# ==================================================================================================
#
#  Read by scripts/score_retrieval.py, which scores keyword search against it. docs/evaluation.md
#  explains how to add a question and how to read the scores.
#
#  Each question is a [[question]] table with these fields:
#
#      id         a short, stable name for the question, unique in this file
#      kind       one of the five kinds below
#      question   the question, worded the way a user would ask it
#      expected   the sections that answer it: any one of them counts as a correct result
#      obsolete   stale-trap only: sections of obsolete RFCs that also match the question
#
#  A section is { rfc = <number>, section = "<number>" }, with the section number as a string,
#  exactly as the index records it. A result matches only its exact section: 15.5.5 isn't 15.5.
#  Each expected section also has a quote, copied from one line of that section, as evidence for
#  review. replaced_by names the newest RFC in the corpus whose Obsoletes: header names the
#  section's RFC.
#
#  The kinds:
#
#      direct             one topic in one place answers it
#      multi-section      the answer needs more than one section
#      stale-trap         an obsolete RFC also matches, but the current RFC answers it.
#                         Lists obsolete sections, each with replaced_by
#      version-specific   it asks about an earlier version, so an obsolete RFC answers it.
#                         Each expected section has replaced_by
#      out-of-corpus      no RFC in the corpus answers it: no expected sections

# --------------------------------------------------------------------------------------------------
#  direct
# --------------------------------------------------------------------------------------------------

[[question]]
id       = "api-error-details"
kind     = "direct"
question = "How can an HTTP API return a machine-readable description of what went wrong?"
expected = [
    { rfc = 9457, section = "1", quote = "[JSON] and XML [XML] document formats to describe the specifics of a" },
    { rfc = 9457, section = "3", quote = "The canonical model for problem details is a JSON [JSON] object." },
]

[[question]]
id       = "tcp-data-in-syn"
kind     = "direct"
question = "How can a TCP client send data in its SYN so it doesn't wait a round trip?"
expected = [
    { rfc = 7413, section = "1", quote = "data to be exchanged safely during TCP's connection handshake." },
    { rfc = 7413, section = "2", quote = "removes the constraint and allows data in SYN packets to be delivered" },
    { rfc = 7413, section = "3", quote = "The client sends a SYN with data and the cookie in the Fast Open" },
    { rfc = 7413, section = "4.2.2", quote = "To open a TFO connection, the client MUST have obtained a cookie" },
]

[[question]]
id       = "tls-application-protocol"
kind     = "direct"
question = "How does a TLS client tell the server which application protocol it wants to speak on the connection?"
expected = [
    { rfc = 7301, section = "1", quote = "layer to negotiate protocol selection within the TLS handshake." },
    { rfc = 7301, section = "3.1", quote = "\"ProtocolNameList\" contains the list of protocols advertised by the" },
]

[[question]]
id       = "tcp-blind-reset"
kind     = "direct"
question = "How does a TCP endpoint protect itself from an attacker who injects a spoofed RST without seeing the traffic?"
expected = [
    { rfc = 5961, section = "3.2", quote = "If the RST bit is set and the sequence number exactly matches the" },
    { rfc = 9293, section = "3.10.7.4", quote = "a \"challenge ACK\" to the remote peer:" },
]

# --------------------------------------------------------------------------------------------------
#  multi-section
# --------------------------------------------------------------------------------------------------

[[question]]
id       = "cookie-scope"
kind     = "multi-section"
question = "How do a cookie's Domain and Path attributes limit which requests it is sent with?"
expected = [
    { rfc = 6265, section = "4.1.2.3", quote = "The Domain attribute specifies those hosts to which the cookie will" },
    { rfc = 6265, section = "4.1.2.4", quote = "The scope of each cookie is limited to a set of paths, controlled by" },
    { rfc = 6265, section = "5.4", quote = "The user agent includes stored cookies in the Cookie HTTP request" },
]

[[question]]
id       = "websocket-open-close"
kind     = "multi-section"
question = "How is a WebSocket connection opened, and how is it closed cleanly?"
expected = [
    { rfc = 6455, section = "1.3", quote = "handshake is an HTTP Upgrade request:" },
    { rfc = 6455, section = "1.4", quote = "The closing handshake is far simpler than the opening handshake." },
    { rfc = 6455, section = "4.1", quote = "To _Establish a WebSocket Connection_, a client opens a connection" },
    { rfc = 6455, section = "7.1.1", quote = "cleanly closes the TCP connection, as well as the TLS session, if" },
    { rfc = 6455, section = "7.1.2", quote = "/reason/, an endpoint MUST send a Close control frame, as described" },
]

